services:
  tariff-inference-api:
    build:
      context: .
    container_name: tariff-inference-api
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
    command: uvicorn api_service:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
